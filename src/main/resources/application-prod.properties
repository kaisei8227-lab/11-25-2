# ===== Render（本番）用の設定 =====
# SPRING_PROFILES_ACTIVE=prod の時だけ読み込まれ、application.properties の同じ項目を上書きする。
# パソコンで動かす時（Eclipse）は今までどおり application.properties の設定が使われる。

# Render が指定するポートで起動する
server.port=${PORT:8080}
server.address=0.0.0.0

# Render の PostgreSQL（値は render.yaml で環境変数として渡される）
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# テーブルはエンティティから自動で作る・列を追加する（データは消さない）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 本番では H2 コンソールや開発ツールを使わない
spring.h2.console.enabled=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
